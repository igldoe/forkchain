name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: mypy (strict)
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest with coverage
        run: pytest --cov=forkchain --cov-report=term-missing --cov-fail-under=85
      - name: core coverage gate (consensus, mempool, VM)
        run: |
          coverage report --fail-under=90 --include="*/forkchain/block.py,*/forkchain/chain.py,*/forkchain/merkle.py,*/forkchain/pow.py,*/forkchain/tx.py,*/forkchain/utxo.py,*/forkchain/validation.py,*/forkchain/mempool.py,*/forkchain/script/*"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t forkchain:ci .
      - name: smoke test
        run: docker run --rm forkchain:ci sim --nodes 3 --duration 4 --block-time 0.4 --partition 1:2.5 --quiet
